<meta name="description" content="Servolec : couvertures de livres et avis partagés du groupe de lecture." />

<style>
/* ===============================================================
   THÈME  —  éditorial contemporain, chaud & épuré
   =============================================================== */
:root{
  --bg:        #f7f4ee;
  --bg-2:      #efeae0;
  --card:      #ffffff;
  --ink:       #201e1a;
  --ink-soft:  #5d574c;
  --ink-faint: #938b7c;
  --accent:    #c0563b;   /* terracotta */
  --accent-deep:#a2452c;
  --accent-soft:#f3ddd3;
  --line:      #e8e2d6;
  --line-soft: #f1ece2;
  --radius:    16px;
  --radius-sm: 10px;
  --shadow-xs: 0 1px 2px rgba(32,30,26,.05);
  --shadow-sm: 0 2px 6px rgba(32,30,26,.06), 0 8px 22px rgba(32,30,26,.05);
  --shadow-md: 0 6px 16px rgba(32,30,26,.09), 0 18px 44px rgba(32,30,26,.08);
  --shadow-lg: 0 18px 40px rgba(32,30,26,.18), 0 6px 14px rgba(32,30,26,.10);
  --sans:      "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
  --display:   "Fraunces", Georgia, serif;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--sans);
  color:var(--ink);
  background-color:var(--bg);
  background-image:
    radial-gradient(80% 60% at 100% -5%, rgba(192,86,59,.07), transparent 60%),
    radial-gradient(70% 55% at 0% 0%, rgba(255,255,255,.7), transparent 55%);
  min-height:100vh;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.wrap{ position:relative; }

a{ color:var(--accent); text-decoration:none; text-underline-offset:3px; }
a:hover{ text-decoration:underline; }
img{ max-width:100%; display:block; }
button{ font-family:inherit; cursor:pointer; }

/* ===============================================================
   EN-TÊTE
   =============================================================== */
header.top{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  flex-wrap:wrap;
  max-width:1180px; margin:0 auto; padding:26px 24px 20px;
}
.brand{ display:block; color:inherit; text-decoration:none; }
.brand:hover{ text-decoration:none; }
.brand .name{
  font-family:var(--display);
  font-weight:600; font-optical-sizing:auto;
  font-size:clamp(28px,5.2vw,40px);
  letter-spacing:-.025em; line-height:1; margin:0;
}
.brand .name b{ color:var(--accent); font-weight:600; }
.brand .sub{
  font-size:clamp(12px,2.2vw,13.5px); letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-faint); margin-top:7px; font-weight:600;
}

.admin-zone{ display:flex; align-items:center; gap:10px; font-size:14px; }
.admin-zone .who{ color:var(--ink-soft); font-weight:500; }
.admin-zone .badge{
  font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:700;
  color:var(--accent-deep); background:var(--accent-soft); border-radius:99px;
  padding:3px 10px;
}

/* ===============================================================
   BOUTONS
   =============================================================== */
.btn{
  font-family:var(--sans); font-size:14.5px; font-weight:600;
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:9px 17px; border-radius:99px;
  transition:transform .12s ease, background .15s ease, color .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.btn:hover{ transform:translateY(-1px); box-shadow:var(--shadow-sm); }
.btn:active{ transform:translateY(0); }
.btn.primary{ background:var(--ink); border-color:var(--ink); color:#fbf8f2; }
.btn.primary:hover{ background:#000; border-color:#000; }
.btn.ghost{ background:transparent; border-color:var(--line); color:var(--ink-soft); }
.btn.ghost:hover{ border-color:var(--ink-faint); color:var(--ink); background:var(--card); }
.btn.tiny{ font-size:13px; padding:6px 13px; }
.btn.danger{ color:var(--accent-deep); border-color:var(--accent-soft); background:transparent; }
.btn.danger:hover{ background:var(--accent); color:#fff; border-color:var(--accent); }
.btn[disabled]{ opacity:.5; cursor:default; transform:none; box-shadow:none; }

/* ===============================================================
   CONTENEUR PRINCIPAL
   =============================================================== */
main{ max-width:1180px; margin:0 auto; padding:14px 24px 96px; }

.hero{ padding:30px 0 40px; }
.hero h2{
  font-family:var(--display); font-weight:380; font-optical-sizing:auto;
  font-size:clamp(30px,6vw,52px); margin:0; letter-spacing:-.02em; line-height:1.02;
}
.hero p{ color:var(--ink-soft); margin:14px 0 0; max-width:540px; font-size:clamp(15px,2.4vw,17px); }
.rule{ width:54px; height:3px; border-radius:99px; background:var(--accent); margin-top:22px; }

/* ===============================================================
   GRILLE DE COUVERTURES
   =============================================================== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(176px,1fr));
  gap:36px 28px;
}
@media (max-width:560px){
  .grid{ grid-template-columns:repeat(auto-fill, minmax(144px,1fr)); gap:28px 18px; }
}
.book{
  text-align:left; background:none; border:none; padding:0; margin:0;
  display:flex; flex-direction:column; gap:13px;
  animation:rise .55s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes rise{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }

.cover-frame{
  position:relative; aspect-ratio:2/3; border-radius:var(--radius-sm);
  overflow:hidden; background:var(--bg-2); border:1px solid var(--line-soft);
  box-shadow:var(--shadow-sm);
  transition:transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s ease;
}
.cover-frame img{ width:100%; height:100%; object-fit:cover; transition:transform .4s cubic-bezier(.2,.7,.2,1); }
.book:hover .cover-frame, .book:focus-visible .cover-frame{ transform:translateY(-6px); box-shadow:var(--shadow-md); }
.book:hover .cover-frame img{ transform:scale(1.045); }
.book:focus-visible{ outline:none; }

.cover-missing{
  width:100%; height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; gap:4px; padding:16px;
  color:var(--ink-faint); font-size:13px;
  background:linear-gradient(160deg, var(--bg-2), #e7e0d2);
}
.cover-missing .mark{ font-family:var(--display); font-size:30px; color:var(--accent-soft); line-height:1; }
.book .meta .t{ font-family:var(--display); font-weight:560; font-size:17px; line-height:1.22; letter-spacing:-.01em; }
.book .meta .a{ color:var(--ink-soft); font-size:14px; margin-top:2px; }
.book .meta .c{ color:var(--accent); font-size:13px; font-weight:600; margin-top:7px; }

/* carte « ajouter » */
.add-card{
  aspect-ratio:2/3; border:1.5px dashed var(--accent); border-radius:var(--radius-sm);
  background:var(--accent-soft); color:var(--accent-deep);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  font-family:var(--sans); font-weight:600; font-size:15px;
  transition:background .15s ease, transform .2s ease, box-shadow .2s ease;
}
.add-card:hover{ transform:translateY(-5px); box-shadow:var(--shadow-md); filter:brightness(1.02); }
.add-card .plus{ font-size:38px; line-height:1; font-weight:300; }

/* disponibilité */
.status-pill{ position:absolute; top:8px; left:8px; z-index:3; display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:99px; background:rgba(255,255,255,.94); color:var(--ink); box-shadow:var(--shadow-xs); }
.status-pill .ic{ width:15px; height:15px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:10px; font-weight:900; line-height:1; flex:none; }
.status-pill.avail .ic{ background:#2f9e5b; }
.status-pill.borrowed .ic{ background:#c0392b; }
.status-pill .ic svg, .book-status .ic svg{ width:100%; height:100%; display:block; }
.status-pill.clickable{ cursor:pointer; transition:transform .12s ease, background .12s ease; }
.status-pill.clickable:hover{ background:#fff; transform:translateY(-1px); }
.book-status{ display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:700; margin-top:6px; }
.book-status .ic{ width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:900; line-height:1; }
.book-status.avail{ color:#2f7d4f; } .book-status.avail .ic{ background:#2f9e5b; }
.book-status.borrowed{ color:#a23a2c; } .book-status.borrowed .ic{ background:#c0392b; }
.admin-controls{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
.check{ display:inline-flex; align-items:center; gap:9px; cursor:pointer; font-weight:600; color:var(--ink); font-size:14.5px; margin-top:2px; }
.check input{ width:17px; height:17px; accent-color:var(--accent); cursor:pointer; }
.export-choices{ display:flex; flex-direction:column; gap:10px; margin:4px 0 2px; }
.export-choices .btn{ width:100%; justify-content:center; text-align:center; padding:12px 16px; }

/* ===============================================================
   PAGE LIVRE
   =============================================================== */
.back{ display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14.5px; color:var(--ink-soft); margin:6px 0 26px; }
.back:hover{ color:var(--accent); text-decoration:none; }

.book-layout{ display:grid; grid-template-columns:288px 1fr; gap:54px; align-items:start; }
@media (max-width:760px){ .book-layout{ grid-template-columns:1fr; gap:32px; } }

.book-cover-big{ position:sticky; top:24px; }
@media (max-width:760px){ .book-cover-big{ position:static; max-width:220px; margin:0 auto; } }
.book-cover-big .cover-frame{ box-shadow:var(--shadow-lg); }

.book-head .kicker{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; }
.book-head h1{
  font-family:var(--display); font-weight:560; font-optical-sizing:auto;
  font-size:clamp(28px,5vw,44px); line-height:1.04; letter-spacing:-.02em; margin:8px 0 6px;
}
.book-head .author{ font-size:18px; color:var(--ink-soft); margin:0 0 6px; }
.book-head .note{
  background:var(--card); border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:var(--radius-sm); padding:14px 16px; margin:18px 0 0;
  color:var(--ink-soft); font-size:16px;
}

.section-title{
  font-family:var(--display); font-weight:520; font-size:23px; margin:40px 0 0;
  display:flex; align-items:baseline; gap:10px; letter-spacing:-.01em;
}
.section-title .count{ font-family:var(--sans); font-size:14px; font-weight:600; color:var(--ink-faint); }
.divider{ height:1px; background:var(--line); margin:16px 0 24px; }

/* commentaires */
.comment{ padding:0 0 20px; margin:0 0 20px; border-bottom:1px solid var(--line-soft); animation:fade .4s ease both; }
@keyframes fade{ from{ opacity:0 } to{ opacity:1 } }
.comment:last-of-type{ border-bottom:none; }
.comment .head{ display:flex; align-items:center; gap:10px; margin-bottom:5px; }
.comment .name{ font-weight:700; font-size:15.5px; }
.comment .name.mine::after{ content:"vous"; margin-left:7px; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-deep); background:var(--accent-soft); padding:2px 8px; border-radius:99px; }
.comment .date{ font-size:13px; color:var(--ink-faint); }
.comment .text{ white-space:pre-wrap; font-size:16px; color:var(--ink); }
.comment .del{ margin-left:auto; }
.empty-note{ color:var(--ink-faint); font-size:15.5px; }

/* notation par étoiles */
.stars{ display:inline-flex; gap:2px; line-height:1; }
.stars .star{ color:var(--line); }
.stars .star.on{ color:var(--accent); }
.rating-summary{ align-items:center; gap:11px; margin:14px 0 0; }
.rating-summary .stars{ font-size:19px; }
.rating-summary .avg-num{ font-weight:700; font-size:15px; }
.rating-summary .avg-cnt{ color:var(--ink-faint); font-size:13.5px; }
.comment-stars{ margin:1px 0 7px; }
.comment-stars .stars{ font-size:15px; }
.star-picker{ display:inline-flex; gap:5px; font-size:27px; line-height:1; cursor:pointer; user-select:none; }
.star-picker .star{ color:var(--line); transition:color .12s ease, transform .12s ease; }
.star-picker .star.on{ color:var(--accent); }
.star-picker .star:hover{ transform:scale(1.14); }

/* formulaire commentaire */
.cform{ margin-top:32px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow-sm); }
.cform h3{ font-family:var(--display); font-weight:540; font-size:19px; margin:0 0 16px; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12.5px; font-weight:600; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:6px; }
input[type=text], input[type=password], textarea{
  width:100%; font-family:var(--sans); font-size:15.5px; color:var(--ink);
  background:#fffdfa; border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 13px;
  transition:border-color .15s ease, box-shadow .15s ease;
}
input[type=text]:focus, input[type=password]:focus, textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(192,86,59,.15); }
.login-err{ color:var(--accent-deep); font-size:13.5px; font-weight:600; min-height:18px; margin-top:2px; }
textarea{ resize:vertical; min-height:104px; line-height:1.55; }
.cform .row{ display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.cform .hint{ font-size:13px; color:var(--ink-faint); }

/* ===============================================================
   MODALE (ajout de livre)
   =============================================================== */
.modal-bg{ position:fixed; inset:0; background:rgba(32,30,26,.5); backdrop-filter:blur(3px); z-index:50; display:flex; align-items:flex-start; justify-content:center; padding:34px 18px; overflow:auto; animation:fade .2s ease both; }
.modal{ background:var(--bg); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow-lg); width:min(640px,100%); padding:28px; animation:rise .35s cubic-bezier(.2,.7,.2,1) both; }
.modal h2{ font-family:var(--display); font-weight:560; font-size:25px; margin:0 0 4px; letter-spacing:-.01em; }
.modal .sub{ color:var(--ink-soft); margin:0 0 22px; font-size:14.5px; }
.modal-grid{ display:grid; grid-template-columns:1fr 150px; gap:20px; }
@media (max-width:520px){ .modal-grid{ grid-template-columns:1fr; } }
.preview{ aspect-ratio:2/3; border-radius:var(--radius-sm); overflow:hidden; background:var(--bg-2); border:1px solid var(--line); box-shadow:var(--shadow-xs); display:flex; align-items:center; justify-content:center; }
.preview .ph{ color:var(--ink-faint); font-size:12.5px; text-align:center; padding:10px; }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:24px; }
.import-box{ background:var(--bg-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px 14px 12px; margin-bottom:20px; }
.import-box > label{ display:block; font-size:12.5px; font-weight:600; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:9px; }
.import-row{ display:flex; gap:10px; }
.import-row input{ flex:1; }
.import-row .btn{ white-space:nowrap; }
.import-status{ font-size:13px; color:var(--ink-soft); margin-top:9px; min-height:16px; line-height:1.4; }

/* ===============================================================
   ÉTATS
   =============================================================== */
.center-state{ text-align:center; padding:72px 20px; color:var(--ink-soft); }
.center-state .big{ font-family:var(--display); font-size:24px; color:var(--ink); margin-bottom:8px; letter-spacing:-.01em; }
.center-state .quill{ font-family:var(--display); font-size:40px; color:var(--accent-soft); margin-bottom:10px; line-height:1; }
.spinner{ width:32px; height:32px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; margin:0 auto 16px; animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.setup{ max-width:680px; margin:40px auto; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:30px; box-shadow:var(--shadow-sm); }
.setup h2{ font-family:var(--display); color:var(--accent-deep); margin-top:0; }
.setup code{ background:var(--bg-2); padding:2px 6px; border-radius:5px; font-size:13px; }

.toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:12px 22px; border-radius:99px; box-shadow:var(--shadow-md); font-size:14.5px; font-weight:500; opacity:0; transition:.25s ease; z-index:80; pointer-events:none; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

footer.foot{ text-align:center; color:var(--ink-faint); font-size:13px; padding:34px 20px 44px; }
footer.foot b{ color:var(--ink-soft); font-weight:700; }
</style>
</head>

    <div class="admin-zone" id="adminZone"></div>

  </footer>
</div>

<div id="modalRoot"></div>

/* ↓↓↓  Mets ici l'adresse e-mail (l'identifiant) de l'administrateur.  ↓↓↓
   C'est la SEULE adresse autorisée à ajouter / supprimer des livres.

/* ---------- petits utilitaires DOM ---------- */
function el(tag, props = {}, kids = []){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(props)){
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;            // uniquement pour contenu sûr (icônes)
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)){
    if (c == null) continue;
    n.append(c.nodeType ? c : document.createTextNode(c));   // texte = sûr (échappé)
  }
  return n;
}
const fmtDate = ts => {
  if (!ts || !ts.toDate) return "à l'instant";
  return new Intl.DateTimeFormat("fr-FR",{ day:"numeric", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit" }).format(ts.toDate());
};
function starsNode(value){
  const wrap = el("span",{class:"stars"});
  for (let i = 1; i <= 5; i++) wrap.append(el("span",{class:"star"+(i <= value ? " on" : "")},"♥"));

}

function renderHome(){
  app.innerHTML = "";
  app.append(el("section",{class:"hero"},[
    el("h2",{},"La sélection"),
    el("p",{},"Choisissez un livre pour lire les avis du groupe et partager le vôtre."),
    el("div",{class:"rule"})
  ]));

  const grid = el("div",{class:"grid"});
  app.append(grid);
  grid.append(el("div",{class:"center-state", style:"grid-column:1/-1"},[el("div",{class:"spinner"}),"Chargement des couvertures…"]));

  const cards = new Map();   // id -> { card, data }
  let addCard = null;
  let first = true;

  const qy = query(collection(db,"books"), orderBy("createdAt","desc"));
  unsubscribe = onSnapshot(qy, snap => {
    if (first){ grid.innerHTML = ""; first = false; }

    if (snap.empty && !isAdmin){
      grid.innerHTML = ""; cards.clear();
      grid.append(el("div",{class:"center-state", style:"grid-column:1/-1"},[
        el("div",{class:"quill"},"✦"),
        el("div",{class:"big"},"La bibliothèque est encore vide"),
        el("div",{},"Les premiers livres arriveront bientôt.")
      ]));
      return;
    }

    const order = [];
    if (isAdmin){
      if (!addCard) addCard = el("button",{class:"add-card", onclick:openAddBook},[
        el("span",{class:"plus"},"+"), el("span",{},"Ajouter un livre")
      ]);
      order.push(addCard);
    }

    const seen = new Set();
    let i = 0;
    snap.forEach(d => {
      const id = d.id, b = d.data();
      seen.add(id);
      let entry = cards.get(id);
      if (!entry){
        entry = { card: bookCard(id, b, i), data: b };
        cards.set(id, entry);
      } else {
        updateCard(entry.card, id, b, entry.data);
        entry.data = b;
      }
      order.push(entry.card);
      i++;
    });

    for (const [id, entry] of cards){
      if (!seen.has(id)){ entry.card.remove(); cards.delete(id); }
    }
    // Réconciliation minimale : on ne déplace un nœud que si son ordre a changé.
    // En cas de simple bascule de statut, l'ordre est identique => aucune
    // couverture n'est ré-attachée, donc pas de rechargement d'image.
    let ref = grid.firstChild;
    for (const node of order){
      if (ref === node){ ref = ref.nextSibling; }
      else { grid.insertBefore(node, ref); }
    }
  }, err => {
    grid.innerHTML = "";
    grid.append(el("div",{class:"center-state", style:"grid-column:1/-1"},
      "Impossible de charger la bibliothèque. Vérifiez la configuration / les règles Firestore."));
    console.error(err);
  });
}

/* Met à jour une carte sans recréer la couverture (sauf si le lien a changé). */
function updateCard(card, id, b, prev){
  prev = prev || {};
  const frame = card.querySelector(".cover-frame");
  if (b.coverUrl !== prev.coverUrl){
    const nf = coverNode(b.coverUrl, b.title);
    nf.append(statusPill(id, b));
    if (frame) card.replaceChild(nf, frame);
  } else if (frame){
    const oldPill = frame.querySelector(".status-pill");
    if (oldPill) oldPill.remove();
    frame.append(statusPill(id, b));
  }
  const t = card.querySelector(".meta .t");
  if (t) t.textContent = b.title || "Sans titre";
  const meta = card.querySelector(".meta");
  const a = card.querySelector(".meta .a");
  if (b.author){
    if (a) a.textContent = b.author;
    else if (meta) meta.append(el("div",{class:"a"}, b.author));
  } else if (a){ a.remove(); }
}

function coverNode(url, title){
  const frame = el("div",{class:"cover-frame"});
  if (url){
    const img = el("img",{ src:url, alt:"Couverture de "+(title||"l'ouvrage"), loading:"lazy", referrerpolicy:"no-referrer" });
    img.addEventListener("error", ()=>{ frame.innerHTML=""; frame.append(missingCover()); });
    frame.append(img);
  } else {
    frame.append(missingCover());
  }
  return frame;
}
const missingCover = () => el("div",{class:"cover-missing"},[el("span",{class:"mark"},"✦"),el("span",{},"Couverture indisponible")]);

function statusPill(id, b){
  const avail = b.available === true;
  const pill = el("span",{class:"status-pill clickable "+(avail?"avail":"borrowed")},[
    el("span",{class:"ic", html: avail ? ICON_OK : ICON_NO}), avail ? "Disponible" : "Emprunté"
  ]);
  pill.title = "Cliquer pour changer la disponibilité";
  pill.addEventListener("click", async (e) => {
    e.preventDefault(); e.stopPropagation();
    try{ await updateDoc(doc(db,"books",id), { available: !avail }); }
    catch(err){ console.error(err); toast("Modification impossible."); }
  });
  return pill;
}

function bookCard(id, b, i){
  const card = el("button",{
    class:"book", style:`animation-delay:${Math.min(i*55,500)}ms`,
    onclick:()=>{ location.hash = "#/book/"+encodeURIComponent(id); }
  });
  const frame = coverNode(b.coverUrl, b.title);
  frame.append(statusPill(id, b));
  card.append(frame);
  const meta = el("div",{class:"meta"},[
    el("div",{class:"t"}, b.title || "Sans titre"),
    b.author ? el("div",{class:"a"}, b.author) : null
  ]);
  card.append(meta);
  return card;
}

/* Récupère titre / couverture / description (/ auteur si dispo) depuis une page web.
   Passe par un relais public car le navigateur ne peut pas lire un autre site directement. */
async function fetchBookMeta(url){
  if (!/^https?:\/\//i.test(url)) url = "https://" + url;
  const proxies = [
    u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`
  ];
  let html = null;
  for (const make of proxies){
    try{
      const r = await fetch(make(url));
      if (r.ok){ const t = await r.text(); if (t && t.length > 200){ html = t; break; } }
    }catch(_){ /* on tente le relais suivant */ }
  }
  if (!html) throw new Error("Aucun contenu récupéré.");

  const dom = new DOMParser().parseFromString(html, "text/html");
  const m = (sel) => { const e = dom.querySelector(sel); return e ? (e.getAttribute("content")||"").trim() : ""; };

  const title = m('meta[property="og:title"]') || m('meta[name="twitter:title"]') ||
                (dom.querySelector("title")?.textContent || "").trim();
  const cover = m('meta[property="og:image"]') || m('meta[name="twitter:image"]') ||
                m('meta[property="og:image:url"]');
  const desc  = m('meta[property="og:description"]') || m('meta[name="description"]') ||
                m('meta[name="twitter:description"]');

  // Auteur : uniquement via données structurées JSON-LD (fiable), sinon vide.
  let author = "";
  dom.querySelectorAll('script[type="application/ld+json"]').forEach(s => {
    if (author) return;
    try{
      const arr = [].concat(JSON.parse(s.textContent));
      for (const node of arr){
        const a = node && node.author;
        if (a){ author = Array.isArray(a) ? (a[0]?.name || a[0] || "") : (a.name || a || ""); break; }
      }
    }catch(_){}
  });

  return { title, author: typeof author === "string" ? author : "", cover, desc };
}

function openAddBook(){
  const bg = el("div",{class:"modal-bg", onclick:e=>{ if(e.target===bg) close(); }});
  const titleI  = el("input",{type:"text", placeholder:"Titre du livre"});
  const authorI = el("input",{type:"text", placeholder:"Auteur ou autrice"});
  const urlI    = el("input",{type:"text", placeholder:"https://… (lien de l'image de couverture)"});
  const noteI   = el("textarea",{placeholder:"Note de présentation (facultatif)", style:"min-height:70px"});
  const availI  = el("input",{type:"checkbox"});

  const urlImportI   = el("input",{type:"text", placeholder:"https://… (page du livre : Bedetheque…)"});
  const importBtn    = el("button",{class:"btn", onclick:doImport},"Récupérer");
  const importStatus = el("div",{class:"import-status"},"");
  const importBox = el("div",{class:"import-box"},[
    el("label",{},"Pré-remplir depuis un lien (facultatif)"),
    el("div",{class:"import-row"},[ urlImportI, importBtn ]),
    importStatus

  urlImportI.addEventListener("keydown", e => { if (e.key === "Enter") doImport(); });

  const prev = el("div",{class:"preview"},[el("div",{class:"ph"},"Aperçu de la couverture")]);
  urlI.addEventListener("input", ()=>{
    const u = urlI.value.trim();
    prev.innerHTML = "";
    if (!u){ prev.append(el("div",{class:"ph"},"Aperçu de la couverture")); return; }
    const img = el("img",{src:u, referrerpolicy:"no-referrer", style:"width:100%;height:100%;object-fit:cover"});
    img.addEventListener("error",()=>{ prev.innerHTML=""; prev.append(el("div",{class:"ph"},"Lien non valide ou image bloquée")); });
    prev.append(img);
  });

  const modal = el("div",{class:"modal"},[
    el("h2",{},"Nouveau livre"),
    el("p",{class:"sub"},"Collez un lien pour pré-remplir, ou saisissez tout à la main."),
    importBox,
    el("div",{class:"modal-grid"},[
      el("div",{},[
        el("div",{class:"field"},[el("label",{},"Titre"), titleI]),
        el("div",{class:"field"},[el("label",{},"Auteur·rice"), authorI]),
        el("div",{class:"field"},[el("label",{},"Lien de la couverture"), urlI])
      ]),
      el("div",{},[el("label",{style:"font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;display:block"},"Aperçu"), prev])
    ]),

  bg.append(modal); modalRoot.append(bg);

  async function doImport(){
    const url = urlImportI.value.trim();
    if (!url){ importStatus.textContent = "Collez d'abord un lien."; return; }
    importBtn.disabled = true; importBtn.textContent = "…";
    importStatus.textContent = "Récupération en cours…";
    try{
      const meta = await fetchBookMeta(url);
      if (meta.title)  titleI.value  = meta.title;
      if (meta.author) authorI.value = meta.author;
      if (meta.cover){ urlI.value = meta.cover; urlI.dispatchEvent(new Event("input")); }
      if (meta.desc)   noteI.value = meta.desc;
      const got = [meta.title&&"titre", meta.author&&"auteur", meta.cover&&"couverture", meta.desc&&"description"].filter(Boolean);
      importStatus.textContent = got.length
        ? "Récupéré : " + got.join(", ") + ". Vérifiez et complétez si besoin."
        : "Aucune information trouvée sur cette page. Remplissez les champs à la main.";
    }catch(e){
      console.error(e);
      importStatus.textContent = "Récupération impossible (page protégée ou service momentanément indisponible). Remplissez à la main.";
    }finally{
      importBtn.disabled = false; importBtn.textContent = "Récupérer";
    }
  }
  function close(){ bg.remove(); }
  async function save(){
    const title = titleI.value.trim();
    if (!title){ toast("Indiquez au moins un titre."); titleI.focus(); return; }
    const btn = modal.querySelector(".btn.primary");
    btn.disabled = true; btn.textContent = "Ajout…";
    try{
      await addDoc(collection(db,"books"),{
        title,
        author: authorI.value.trim(),
        coverUrl: urlI.value.trim(),
        note: noteI.value.trim(),
        available: availI.checked,
        createdAt: serverTimestamp()
      });
      close(); toast("Livre ajouté.");
    }catch(e){
      console.error(e); toast("Échec de l'ajout (droits / config ?)");
      btn.disabled = false; btn.textContent = "Ajouter à la bibliothèque";
    }
  }
}

async function removeBook(id, title){
  if (!confirm(`Supprimer « ${title||"ce livre"} » de la bibliothèque ?`)) return;
  try{ await deleteDoc(doc(db,"books",id)); toast("Livre supprimé."); location.hash="#/"; }
  catch(e){ console.error(e); toast("Suppression impossible."); }
}
async function removeComment(bookId, cId){
  if (!confirm("Supprimer ce commentaire ?")) return;
  try{ await deleteDoc(doc(db,"books",bookId,"comments",cId)); toast("Commentaire supprimé."); }
  catch(e){ console.error(e); toast("Suppression impossible."); }
}

/* ---------- export d'un rapport HTML stylé des avis (admin) ---------- */
function todayStr(){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function escapeHtml(s){
  return (s==null?"":String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function heartsHtml(v, inline){
  let s = '<span class="hearts">';
  for (let i=1;i<=5;i++){
    if (inline) s += '<span style="color:'+(i<=v?'#c0563b':'#d9d2c4')+';font-size:15px;">&#9829;</span>';
    else s += '<span class="'+(i<=v?'on':'')+'">&#9829;</span>';
  }
  return s + '</span>';
}
const REPORT_CSS = `
:root{--bg:#f7f4ee;--card:#fff;--ink:#201e1a;--soft:#5d574c;--faint:#938b7c;--accent:#c0563b;--line:#e8e2d6;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;line-height:1.55;}
.page{max-width:820px;margin:0 auto;padding:40px 26px 70px;}
header.rep{text-align:center;margin-bottom:30px;border-bottom:1px solid var(--line);padding-bottom:22px;}
header.rep h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:36px;margin:0;letter-spacing:-.02em;}
header.rep h1 b{color:var(--accent);}
header.rep .meta{color:var(--soft);margin-top:8px;font-size:14.5px;}
table.book{width:100%;border-collapse:collapse;margin:0 0 14px;}
table.book td{padding:20px 0;vertical-align:top;border-bottom:1px solid var(--line);}
td.cover-cell{width:148px;padding-right:24px;}
td.cover-cell img{width:118px;border-radius:6px;box-shadow:0 6px 16px rgba(32,30,26,.18);}
.nocover{width:118px;height:177px;border-radius:6px;background:#ece3d3;text-align:center;line-height:177px;color:#cdb083;font-family:"Fraunces",serif;font-size:34px;}
h2{font-family:"Fraunces",Georgia,serif;font-weight:560;font-size:22px;margin:0 0 2px;letter-spacing:-.01em;}
.author{color:var(--soft);font-style:italic;margin-bottom:8px;}
.avg{margin-bottom:12px;}
.avg .avgnum{font-weight:700;font-size:14px;}
.avg .avgcnt{color:var(--faint);font-size:13px;}
.hearts span{color:var(--line);font-size:15px;}
.hearts span.on{color:var(--accent);}
.cmt{border-top:1px solid var(--line);padding:10px 0;}
.cmt:first-of-type{border-top:none;}
.cmeta .name{font-weight:700;}
.cmeta .date{color:var(--faint);font-size:13px;}
.ctext{margin-top:3px;}
footer.rep{text-align:center;color:var(--faint);font-size:12.5px;margin-top:28px;}
@media print{ body{background:#fff;} table.book{break-inside:avoid;box-shadow:none;} .page{padding:0;max-width:none;} }`;

async function gatherReport(forWord){
  const booksSnap = await getDocs(query(collection(db,"books"), orderBy("createdAt","desc")));
  const sections = [];
  let totalComments = 0;
  for (const bk of booksSnap.docs){
    const b = bk.data();
    const cSnap = await getDocs(query(collection(db,"books",bk.id,"comments"), orderBy("createdAt","asc")));
    if (cSnap.empty) continue;
    let sum = 0, n = 0;
    const items = [];
    cSnap.forEach(cd => {
      const c = cd.data();
      totalComments++;
      if (c.rating > 0){ sum += c.rating; n++; }
      const name = escapeHtml(c.name||"Anonyme");
      const date = escapeHtml(fmtDate(c.createdAt));
      const text = c.text ? escapeHtml(c.text).replace(/\n/g,"<br>") : "";
      if (forWord){
        items.push(
          '<div style="border-top:1px solid #e8e2d6;padding:12px 0;">'+
          '<div><span style="font-weight:bold;color:#201e1a;">'+name+'</span> '+
          '<span style="color:#938b7c;font-size:13px;">'+date+'</span> '+
          (c.rating>0 ? heartsHtml(c.rating, true) : '')+'</div>'+
          (text ? '<div style="margin-top:4px;color:#201e1a;">'+text+'</div>' : '')+'</div>'
        );
      } else {
        items.push(
          '<div class="cmt"><div class="cmeta"><span class="name">'+name+'</span> '+
          '<span class="date">'+date+'</span> '+
          (c.rating>0 ? heartsHtml(c.rating) : '')+'</div>'+
          (text ? '<div class="ctext">'+text+'</div>' : '')+'</div>'
        );
      }
    });
    const avg = n ? (sum/n) : 0;
    const avgStr = avg.toFixed(1).replace(".",",");
    const title = escapeHtml(b.title||"Sans titre");
    const author = b.author ? escapeHtml(b.author) : "";
    const url = b.coverUrl || "";

    if (forWord){
      const cover = url
        ? '<img src="'+escapeHtml(url)+'" width="96" height="144" style="width:96px;height:144px;" alt="">'
        : '<div style="width:96px;height:144px;background:#ece3d3;"></div>';
      sections.push(
        '<table width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;margin:0 0 16px;"><tr>'+
          '<td width="120" valign="top" style="padding:6px 24px 20px 0;border-bottom:1px solid #e8e2d6;">'+cover+'</td>'+
          '<td valign="top" style="padding:6px 0 20px;border-bottom:1px solid #e8e2d6;font-family:Georgia,\'Times New Roman\',serif;">'+
            '<div style="font-size:21px;font-weight:bold;color:#201e1a;">'+title+'</div>'+
            (author ? '<div style="font-style:italic;color:#5d574c;margin:4px 0 14px;">'+author+'</div>' : '<div style="margin-bottom:12px;"></div>')+
            (n ? '<div style="margin:0 0 18px;">'+heartsHtml(Math.round(avg), true)+' <span style="font-weight:bold;color:#201e1a;">'+avgStr+' / 5</span> <span style="color:#938b7c;">&middot; '+n+' note'+(n>1?'s':'')+'</span></div>' : '')+
            items.join("")+
          '</td>'+
        '</tr></table>'
      );
    } else {
      const cover = url
        ? '<img src="'+escapeHtml(url)+'" width="118" alt="" referrerpolicy="no-referrer">'
        : '<div class="nocover">&#10022;</div>';
      sections.push(
        '<table class="book" cellspacing="0" cellpadding="0"><tr>'+
          '<td class="cover-cell" width="148" valign="top">'+cover+'</td>'+
          '<td class="content-cell" valign="top">'+
            '<h2>'+title+'</h2>'+
            (author ? '<div class="author">'+author+'</div>' : '')+
            (n ? '<div class="avg">'+heartsHtml(Math.round(avg))+' <span class="avgnum">'+avgStr+' / 5</span> <span class="avgcnt">&middot; '+n+' note'+(n>1?'s':'')+'</span></div>' : '')+
            items.join("")+
          '</td>'+
        '</tr></table>'
      );
    }
  }
  return { sections, totalComments };
}

function reportHeader(totalComments, count, inline){
  const today = new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"long",year:"numeric"}).format(new Date());
  const meta = 'Export du '+today+' &middot; '+totalComments+' avis sur '+count+' livre'+(count>1?'s':'');
  if (inline){
    return '<div style="text-align:center;border-bottom:1px solid #e8e2d6;padding-bottom:18px;margin-bottom:28px;font-family:Georgia,\'Times New Roman\',serif;">'+
      '<div style="font-size:30px;font-weight:bold;color:#201e1a;"><span style="color:#c0563b;">Servo</span>lec &mdash; Avis de lecture</div>'+
      '<div style="color:#5d574c;margin-top:6px;font-size:14px;">'+meta+'</div></div>';
  }
  return '<header class="rep"><h1><b>Servo</b>lec &mdash; Avis de lecture</h1><div class="meta">'+meta+'</div></header>';
}
function styledDoc(sections, totalComments, booklet){
  const pageCss = booklet ? `
@page{ size:A4 landscape; margin:14mm; }
.page{ max-width:none; padding:0; column-count:2; column-gap:20mm; column-fill:auto; }
header.rep{ column-span:all; margin-bottom:18px; padding-bottom:14px; }
header.rep h1{ font-size:26px; }
table.book{ break-inside:avoid; margin:0 0 10px; }
table.book td{ padding:12px 0; }
td.cover-cell{ width:96px; padding-right:14px; }
td.cover-cell img{ width:78px; }
h2{ font-size:17px; }
.cmt{ padding:7px 0; }` : `@page{ size:A4 portrait; }`;
  return `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servolec &mdash; Avis de lecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Hanken+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<style>${REPORT_CSS}${pageCss}</style></head>
<body><div class="page">${reportHeader(totalComments, sections.length)}
${sections.join("\n")}
</div></body></html>`;
}
function wordDoc(sections, totalComments, booklet){
  const header = reportHeader(totalComments, sections.length, true);
  if (booklet){
    let rows = "";
    for (let i = 0; i < sections.length; i += 2){
      const leftCell  = sections[i];
      const rightCell = sections[i+1] || "";
      rows += '<tr>'+
        '<td width="50%" valign="top" style="padding:0 18px 0 0;">'+leftCell+'</td>'+
        '<td width="50%" valign="top" style="padding:0 0 0 18px;">'+rightCell+'</td>'+
        '</tr>';
    }
    return `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head><meta charset="utf-8"><title>Servolec - Avis de lecture</title>
<style>@page Section1 { size:841.9pt 595.3pt; mso-page-orientation:landscape; margin:1.4cm; } div.Section1{ page:Section1; }</style></head>
<body style="font-family:Georgia,'Times New Roman',serif;color:#201e1a;"><div class="Section1">${header}
<table width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;">${rows}</table>
</div></body></html>`;
  }
  return `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head><meta charset="utf-8"><title>Servolec - Avis de lecture</title></head>
<body style="font-family:Georgia,'Times New Roman',serif;color:#201e1a;">${header}
${sections.join("\n")}</body></html>`;
}
function downloadBlob(content, type, filename){
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = el("a",{ href:url, download:filename });
  document.body.append(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
async function exportAs(format){
  toast("Préparation du document…");
  try{
    const wordFmt = (format === "word" || format === "word-booklet");
    const { sections, totalComments } = await gatherReport(wordFmt);
    if (!sections.length){ toast("Aucun avis à exporter."); return; }
    const date = todayStr();
    if (format === "html"){
      downloadBlob(styledDoc(sections, totalComments), "text/html;charset=utf-8", "servolec-avis-"+date+".html");
      toast(totalComments+" avis exportés.");
    } else if (wordFmt){
      const booklet = (format === "word-booklet");
      downloadBlob("\uFEFF"+wordDoc(sections, totalComments, booklet), "application/msword", "servolec-avis-"+date+(booklet?"-livret":"")+".doc");
      toast(totalComments+" avis exportés.");
    } else if (format === "booklet"){
      const w = window.open("", "_blank");
      if (!w){ toast("Autorisez les fenêtres pop-up pour générer le livret."); return; }
      w.document.open(); w.document.write(styledDoc(sections, totalComments, true)); w.document.close();
      w.onload = () => setTimeout(() => { w.focus(); w.print(); }, 700);
      toast("Imprimez en paysage, recto-verso, puis pliez en deux.");
    }
  }catch(e){
    console.error(e); toast("Export impossible.");
  }
}
function openExportChooser(){
  const bg = el("div",{class:"modal-bg", onclick:e=>{ if(e.target===bg) bg.remove(); }});
  const modal = el("div",{class:"modal", style:"max-width:440px"},[
    el("h2",{},"Exporter les avis"),
    el("p",{class:"sub"},"Choisissez le format du document."),
    el("div",{class:"export-choices"},[
      el("button",{class:"btn", onclick:()=>{ bg.remove(); exportAs('booklet'); }},"Livret (paysage, à imprimer)"),
      el("button",{class:"btn", onclick:()=>{ bg.remove(); exportAs('word'); }},"Word (.doc)"),
      el("button",{class:"btn", onclick:()=>{ bg.remove(); exportAs('word-booklet'); }},"Livret Word (paysage)"),
      el("button",{class:"btn", onclick:()=>{ bg.remove(); exportAs('html'); }},"Page web (.html)")
    ]),
    el("div",{class:"modal-actions"},[ el("button",{class:"btn ghost", onclick:()=>bg.remove()},"Annuler") ])
  ]);
  bg.append(modal); modalRoot.append(bg);
}
